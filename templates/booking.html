<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking for {{competition['name']}} || GUDLFT</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">
    <h2 class="bg-dark text-warning p-3 rounded">{{competition['name']}}</h2>
    <p class="fs-5 mt-3">Places available: <span class="badge bg-warning text-dark">{{competition['numberOfPlaces']}}</span></p>
    <form action="/purchasePlaces" method="post">
        <input type="hidden" name="club" value="{{club['name']}}">
        <input type="hidden" name="competition" value="{{competition['name']}}">
        <label for="places" class="form-label">How many places?</label>
        <input type="number" name="places" id="places" class="form-control mb-3"/>
        <button type="submit" class="btn btn-warning">Book</button>
    </form>
</div>
</body>
</html>
